name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase db start
      - run: supabase db lint --local --fail-on error
      - name: Check migrations match supabase/schemas
        run: |
          supabase db schema declarative sync --no-apply --name drift_check
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::supabase/schemas and supabase/migrations differ. Run 'supabase db schema declarative sync --name <change>' and commit the migration."
            git status --porcelain supabase/migrations
            exit 1
          fi
