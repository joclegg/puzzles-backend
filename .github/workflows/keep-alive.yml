name: Keep alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database so the free project doesn't pause
        env:
          SUPABASE_URL: https://nrlmaucpuesfmvqhtupe.supabase.co
          SUPABASE_KEY: sb_publishable_gQgbll0ElIbV41OtkvuXlQ_yUegn2hH
        run: |
          curl --fail --silent --show-error -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_KEY"
